<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIBSON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body.locked {
            overflow: hidden;
            height: 100vh;
        }

        /* Hero Video */
        .hero-video {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .hero-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scroll-prompt {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .scroll-prompt.visible {
            opacity: 0.5;
        }

        /* Image Stream */
        .image-stream {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .image-item {
            position: relative;
            width: 100%;
        }

        .image-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Stat Overlay */
        .stat-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .stat-number {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 28vw;
            line-height: 0.85;
            text-shadow: 0 0 80px rgba(0,0,0,0.5);
            font-weight: 900;
        }

        .stat-label {
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-top: 0.5rem;
        }

        /* Contact Break */
        .contact-break {
            padding: 5rem 1.5rem;
            text-align: center;
            background: #000;
        }

        .contact-break h2 {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 20vw;
            margin-bottom: 2rem;
        }

        .email-form {
            display: flex;
            max-width: 300px;
            margin: 0 auto 3rem;
        }

        .email-form input {
            flex: 1;
            padding: 1rem;
            font-size: 1rem;
            background: transparent;
            border: 1px solid #333;
            border-right: none;
            color: #fff;
            font-family: inherit;
        }

        .email-form input::placeholder {
            color: #666;
        }

        .email-form input:focus {
            outline: none;
            border-color: #fff;
        }

        .email-form button {
            padding: 1rem 1.5rem;
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 1rem;
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
        }

        .phone-giant {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 10vw;
            color: #fff;
            text-decoration: none;
            display: block;
            letter-spacing: 0.02em;
        }

        .phone-sub {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-top: 1rem;
        }

        /* Bio Text */
        .bio-text {
            padding: 4rem 1.5rem;
            background: #000;
        }

        .bio-text p {
            font-size: 0.85rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.5);
            max-width: 280px;
        }

        /* Built by Marco section */
        .built-by-marco {
            padding: 1rem;
            text-align: center;
            background: #000;
            border-bottom: 1px solid #111;
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .built-by-marco a {
            color: #777;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .built-by-marco a:hover {
            color: #fff;
        }

        @media (max-width: 768px) {
            .built-by-marco {
                padding: 1.5rem 1rem;
                font-size: 0.7rem;
            }
        }

        /* Footer */
        footer {
            padding: 2rem 1.5rem;
            font-size: 0.65rem;
            opacity: 0.3;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }

        /* Desktop styles */
        @media (min-width: 768px) {
            .image-stream {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
            }
            
            .image-item:nth-child(5n) {
                grid-column: span 2;
            }
            
            .stat-number {
                font-size: 15vw;
            }
            
            .contact-break {
                grid-column: span 2;
                padding: 8rem 2rem;
            }
            
            .contact-break h2 {
                font-size: 12vw;
            }
            
            .bio-text {
                grid-column: span 2;
                padding: 6rem 2rem;
                display: flex;
                justify-content: center;
            }
            
            .bio-text p {
                max-width: 500px;
                font-size: 1rem;
            }
            
            .phone-giant {
                font-size: 6vw;
            }
            
            .popup-content h2 {
                font-size: 15vw;
            }
            
            .sticky-contact {
                padding: 1rem 2rem;
            }
            
            footer {
                padding: 2rem 4rem;
            }
        }
        
        @media (min-width: 1200px) {
            .image-stream {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .image-item:nth-child(5n) {
                grid-column: span 2;
            }
            
            .image-item:nth-child(7n) {
                grid-column: span 1;
            }
            
            .contact-break, .bio-text {
                grid-column: span 3;
            }
            
            .stat-number {
                font-size: 10vw;
            }
        }

        /* Popup */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-overlay.active {
            display: flex;
        }

        .popup-content {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 320px;
        }

        .popup-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0.5;
        }

        .popup-content h2 {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 25vw;
            margin-bottom: 1rem;
        }

        .popup-content p {
            font-size: 0.85rem;
            opacity: 0.6;
            margin-bottom: 2rem;
        }

        .popup-form {
            display: flex;
            margin-bottom: 2rem;
        }

        .popup-form input {
            flex: 1;
            padding: 1rem;
            font-size: 1rem;
            background: transparent;
            border: 1px solid #333;
            border-right: none;
            color: #fff;
        }

        .popup-form button {
            padding: 1rem 1.5rem;
            font-family: Impact, 'Arial Black', sans-serif;
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
        }

        .popup-phone {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 7vw;
            color: #fff;
            text-decoration: none;
        }

        /* Sticky contact bar */
        .sticky-contact {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            border-top: 1px solid #222;
            padding: 0.75rem 1rem;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .sticky-contact.visible {
            display: flex;
        }

        .sticky-contact a {
            font-family: Impact, 'Arial Black', sans-serif;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .sticky-contact .cta {
            background: #fff;
            color: #000;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        /* Book Now Section */
        .book-now {
            padding: 3rem 1.5rem;
            text-align: center;
            background: #000;
            border-top: 1px solid #333;
        }

        .book-now h2 {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 3rem;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        .consultation-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        .consultation-option {
            padding: 1.5rem;
            border: 2px solid #333;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .consultation-option:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .consultation-option.urgent {
            border-color: #00ff41;
            background: rgba(0, 255, 65, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .consultation-option.urgent:hover {
            border-color: #00ff41;
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
        }

        .option-duration {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .option-subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        .option-price {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .urgent .option-duration {
            color: #ff6b35;
        }

        .urgent .option-price {
            color: #ff6b35;
        }
    </style>
</head>
<body class="locked">

    <!-- Hero Video -->
    <section class="hero-video">
        <video autoplay muted loop playsinline webkit-playsinline preload="auto" poster="videos/poster.jpg">

    <!-- Image Stream -->
    <div class="image-stream" id="imageStream"></div>

    <!-- Sticky Contact Bar -->

    <!-- Contact Popup -->
    <div class="popup-overlay" id="popup">

            <p>Get early access to our next project</p>

                <input type="email" name="email" placeholder="Email" required>

            </form>
            <a href="tel:3102951136" class="popup-phone">310-295-1136</a>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <span>© 2026 Gibson</span>
        <a href="mailto:josh@jwgre.com">josh@jwgre.com</a>
    </footer>

    <!-- Stripe SDK -->
    <script src="https://js.stripe.com/v3/"></script>

    <script>
        // Force lock scroll for 3 seconds - ABSOLUTE lock
        let isLocked = true;
        
        // Force scroll to top immediately
        window.scrollTo(0, 0);
        document.body.style.overflow = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.width = '100%';
        document.body.style.top = '0';
        
        // Backup: keep forcing to top
        const lockInterval = setInterval(() => {
            if (isLocked) window.scrollTo(0, 0);
        }, 10);

        // Unlock after 3 seconds
        setTimeout(() => {
            isLocked = false;
            clearInterval(lockInterval);
            document.body.style.overflow = '';
            document.body.style.position = '';
            document.body.style.width = '';
            document.body.style.top = '';
            document.body.classList.remove('locked');
            document.getElementById('scrollPrompt').classList.add('visible');
        }, 3000);

        // Show popup after 20 seconds OR 50% scroll
        let popupShown = false;
        const popup = document.getElementById('popup');
        function showPopup() {
            if (!popupShown) {
                popup.classList.add('active');
                popupShown = true;
            }
        }

        function closePopup() {
            popup.classList.remove('active');
        }

        // Show popup after 20 seconds
        setTimeout(showPopup, 20000);

        // Show sticky bar and popup on scroll
        const stickyContact = document.getElementById('stickyContact');
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            const viewportHeight = window.innerHeight;
            const docHeight = document.body.scrollHeight - viewportHeight;
            
            // Show sticky bar after scrolling past video
            if (scrolled > viewportHeight) {
                stickyContact.classList.add('visible');
            } else {
                stickyContact.classList.remove('visible');
            }
            
            // Show popup at 40% scroll
            if (scrolled / docHeight > 0.4) {
                showPopup();
            }
        });

        // Close popup on overlay click
        popup.addEventListener('click', (e) => {
            if (e.target === popup) closePopup();
        });

        // All images - Updated with new high-resolution photos from WEBSITE FINALS
        const allImages = [
            "000191380001.jpg", "000191380003.jpg", "000191380006.jpg", "000191380007.jpg",
            "000191380013.jpg", "000191380017.jpg", "000191380018.jpg", "000191380028.jpg", 
            "000191380029.jpg", "000191380032.jpg", "000191390013.jpg", "000191390019.jpg", 
            "000191390024.jpg", "000191390031.jpg", "000191400004.jpg", "000191400007.jpg", 
            "000191400012.jpg", "0003 601 Sinclair Print.jpg", "0005 601 Sinclair Print.jpg", 
            "0006 601 Sinclair Print.jpg", "0011 601 Sinclair Print.jpg", "0012 601 Sinclair Print.jpg", 
            "0014 601 Sinclair Print.jpg", "0016 601 Sinclair Print.jpg", "0026 718 Sunnyhill MLS.jpg", 
            "0033 718 Sunnyhill MLS.jpg", "0036 718 Sunnyhill MLS.jpg", "0040 601 Sinclair Print.jpg", 
            "0041 601 Sinclair Print.jpg", "0041 718 Sunnyhill MLS.jpg", "0042 601 Sinclair Print.jpg", 
            "0043 601 Sinclair Print.jpg", "1 copy.jpg", "1.jpg", "11.jpg", "14.jpg", "16.jpg", 
            "17.jpg", "18.jpg", "19.jpg", "2 copy.jpg", "2.jpg", "24.jpg", "25 copy.jpg", 
            "25.jpg", "26.jpg", "3.jpg", "30.jpg", "31.jpg", "4.jpg", "5.jpg", 
            "601 Sinclair_FullResolution01_.jpg", "601 Sinclair_FullResolution04_.jpg", 
            "601 Sinclair_FullResolution06_.jpg", "601 Sinclair_FullResolution07_.jpg", 
            "601 Sinclair_FullResolution09_.jpg", "601 Sinclair_FullResolution10_.jpg", 
            "601 Sinclair_FullResolution11_.jpg", "601 Sinclair_FullResolution14_.jpg", 
            "601 Sinclair_FullResolution15_.jpg", "7.jpg", "8.jpg", "Glenalbyn7935 copy.jpg", 
            "Glenalbyn7940 copy.jpg", "Glenalbyn7952 copy.jpg", "Glenalbyn7980 copy.jpg", 
            "Glenalbyn8007 copy.jpg", "Glenalbyn8017 copy.jpg", "Glenalbyn8020 copy.jpg", 
            "Glenalbyn8071 copy.jpg", "Glenalbyn8075 copy.jpg", "Glenalbyn8076 copy.jpg", 
            "Glenalbyn8084 copy.jpg", "Glenalbyn8090 copy.jpg", "Glenalbyn8095 copy.jpg"
        ];

        // Aggressive shuffle - run multiple times to really mix it up
        function shuffle(array) {
            for (let k = 0; k < 5; k++) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
            return array;
        }

        // Group by project prefix, then interleave
        const projectGroups = {};
        allImages.forEach(img => {
            const prefix = img.substring(0, 8);
            if (!projectGroups[prefix]) projectGroups[prefix] = [];
            projectGroups[prefix].push(img);
        });
        
        // Shuffle within each group
        Object.keys(projectGroups).forEach(key => {
            projectGroups[key] = shuffle(projectGroups[key]);
        });
        
        // Interleave from all groups
        const shuffledImages = [];
        const groups = Object.values(projectGroups);
        let maxLen = Math.max(...groups.map(g => g.length));
        for (let i = 0; i < maxLen; i++) {
            groups.forEach(group => {
                if (group[i]) shuffledImages.push(group[i]);
            });
        }
        // Final shuffle for extra randomness
        shuffle(shuffledImages);

        // Stats to overlay on certain positions
        const statPositions = {
            5: { number: 'RECORD', label: 'Breaking $ROI' },
            25: { number: '72', label: 'Bathrooms in 2025' },
            50: { number: '$14M', label: 'Renovations Completed' }
        };

        // Contact break positions (every 15 images)
        const contactBreakPositions = [15, 35, 55, 75, 95];

        const stream = document.getElementById('imageStream');

        shuffledImages.forEach((filename, index) => {
            // Insert contact break at intervals
            if (contactBreakPositions.includes(index)) {
                const contactDiv = document.createElement('div');
                contactDiv.className = 'contact-break';
                contactDiv.innerHTML = `
                    <h2>IN?</h2>
                    <a href="tel:3102951136" class="phone-giant">310-295-1136</a>
                    <p class="phone-sub">Text me</p>
                `;
                stream.appendChild(contactDiv);
            }

            // Insert bio once
            if (index === 45) {
                const bioDiv = document.createElement('div');
                bioDiv.className = 'bio-text';
                bioDiv.innerHTML = `
                    <p>Josh + Naomi Gibson. Flipping houses since 2017. Mediterranean-inspired design for people who care about resale and how it feels to live there. LA.</p>
                `;
                stream.appendChild(bioDiv);
            }

            // Add image
            const div = document.createElement('div');
            div.className = 'image-item';
            
            let html = `<img src="images/${filename}" alt="" loading="lazy">`;
            
            if (statPositions[index]) {
                html += `
                    <div class="stat-overlay">
                        <div class="stat-number">${statPositions[index].number}</div>
                        <div class="stat-label">${statPositions[index].label}</div>
                    </div>
                `;
            }
            
            div.innerHTML = html;
            stream.appendChild(div);
        });

        // Stripe Integration for Consultations
        document.addEventListener('DOMContentLoaded', function() {
            const consultationOptions = document.querySelectorAll('.consultation-option');
            
            consultationOptions.forEach(option => {
                option.addEventListener('click', function() {
                    const price = this.dataset.price;
                    const duration = this.dataset.duration;
                    
                    // Create Stripe checkout
                    createCheckoutSession(price, duration);
                });
            });
        });

        async function createCheckoutSession(priceInCents, duration) {
            // Direct Stripe Payment Links (no backend needed)
            let paymentUrl = '';
            
            switch(duration) {
                case 'urgent':
                    // URGENT NEED - Working payment link
                    paymentUrl = 'https://buy.stripe.com/14A14m5LK4SAbMZf7HaAw01';
                    break;
                case '60':
                    // 60 Minute Consultation - Temporary redirect to urgent for testing
                    paymentUrl = 'https://buy.stripe.com/14A14m5LK4SAbMZf7HaAw01';
                    break;
                case '30':
                    // 30 Minute Consultation - Temporary redirect to urgent for testing  
                    paymentUrl = 'https://buy.stripe.com/14A14m5LK4SAbMZf7HaAw01';
                    break;
                case '15':
                    // 15 Minute Consultation - Temporary redirect to urgent for testing
                    paymentUrl = 'https://buy.stripe.com/14A14m5LK4SAbMZf7HaAw01';
                    break;
                default:
                    alert('Invalid consultation option');
                    return;
            }
            
            // Redirect directly to Stripe checkout
            window.location.href = paymentUrl;
        }
    </script>

    <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>

</body>
