<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIBSON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body.locked {
            overflow: hidden;
            height: 100vh;
        }

        /* Hero Video */
        .hero-video {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .hero-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scroll-prompt {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .scroll-prompt.visible {
            opacity: 0.5;
        }

        /* Image Stream */
        .image-stream {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .image-item {
            position: relative;
            width: 100%;
        }

        .image-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Stat Overlay */
        .stat-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .stat-number {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 28vw;
            line-height: 0.85;
            text-shadow: 0 0 80px rgba(0,0,0,0.5);
            font-weight: 900;
        }

        .stat-label {
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-top: 0.5rem;
        }

        /* Contact Break */
        .contact-break {
            padding: 5rem 1.5rem;
            text-align: center;
            background: #000;
        }

        .contact-break h2 {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 20vw;
            margin-bottom: 2rem;
        }

        .email-form {
            display: flex;
            max-width: 300px;
            margin: 0 auto 3rem;
        }

        .email-form input {
            flex: 1;
            padding: 1rem;
            font-size: 1rem;
            background: transparent;
            border: 1px solid #333;
            border-right: none;
            color: #fff;
            font-family: inherit;
        }

        .email-form input::placeholder {
            color: #666;
        }

        .email-form input:focus {
            outline: none;
            border-color: #fff;
        }

        .email-form button {
            padding: 1rem 1.5rem;
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 1rem;
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
        }

        .phone-giant {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 10vw;
            color: #fff;
            text-decoration: none;
            display: block;
            letter-spacing: 0.02em;
        }

        .phone-sub {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-top: 1rem;
        }

        /* Bio Text */
        .bio-text {
            padding: 4rem 1.5rem;
            background: #000;
        }

        .bio-text p {
            font-size: 0.85rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.5);
            max-width: 280px;
        }

        /* Footer */
        footer {
            padding: 2rem 1.5rem;
            font-size: 0.65rem;
            opacity: 0.3;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>
<body class="locked">

    <!-- Hero Video -->
    <section class="hero-video">
        <video autoplay muted loop playsinline>
            <source src="videos/hero.MOV" type="video/quicktime">
            <source src="videos/hero.mp4" type="video/mp4">
        </video>
        <div class="scroll-prompt" id="scrollPrompt">Scroll</div>
    </section>

    <!-- Image Stream -->
    <div class="image-stream" id="imageStream"></div>

    <!-- Footer -->

        <span>© 2026 Gibson</span>
        <a href="mailto:josh@jwgre.com">josh@jwgre.com</a>

        const stream = document.getElementById('imageStream');

        allImages.forEach((filename, index) => {
            // Insert contact break after image 40
            if (index === 40) {
                const contactDiv = document.createElement('div');
                contactDiv.className = 'contact-break';
                contactDiv.innerHTML = `

                `;
                stream.appendChild(contactDiv);
            }

            // Insert bio after image 60
            if (index === 60) {
                const bioDiv = document.createElement('div');
                bioDiv.className = 'bio-text';
                bioDiv.innerHTML = `
                    <p>Josh + Naomi Gibson. Flipping houses since 2017. Mediterranean-inspired design for people who care about resale and how it feels to live there. LA.</p>
                `;
                stream.appendChild(bioDiv);
            }

            // Add image
            const div = document.createElement('div');
            div.className = 'image-item';
            
            let html = `<img src="images/${filename}" alt="" loading="lazy">`;
            
            if (stats[index]) {
                html += `
                    <div class="stat-overlay">
                        <div class="stat-number">${stats[index].number}</div>
                        <div class="stat-label">${stats[index].label}</div>

                `;
            }
            
            div.innerHTML = html;
            stream.appendChild(div);
        });
    </script>

</body>
</html>
