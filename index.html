<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GIBSON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body.locked {
            overflow: hidden;
            height: 100vh;
        }

        /* Hero Video */
        .hero-video {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .hero-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scroll-prompt {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .scroll-prompt.visible {
            opacity: 0.5;
        }

        /* Image Stream */
        .image-stream {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .image-item {
            position: relative;
            width: 100%;
        }

        .image-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Stat Overlay */
        .stat-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .stat-number {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 28vw;
            line-height: 0.85;
            text-shadow: 0 0 80px rgba(0,0,0,0.5);
            font-weight: 900;
        }

        .stat-label {
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-top: 0.5rem;
        }

        /* Contact Break */
        .contact-break {
            padding: 5rem 1.5rem;
            text-align: center;
            background: #000;
        }

        .contact-break h2 {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 20vw;
            margin-bottom: 2rem;
        }

        .email-form {
            display: flex;
            max-width: 300px;
            margin: 0 auto 3rem;
        }

        .email-form input {
            flex: 1;
            padding: 1rem;
            font-size: 1rem;
            background: transparent;
            border: 1px solid #333;
            border-right: none;
            color: #fff;
            font-family: inherit;
        }

        .email-form input::placeholder {
            color: #666;
        }

        .email-form input:focus {
            outline: none;
            border-color: #fff;
        }

        .email-form button {
            padding: 1rem 1.5rem;
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 1rem;
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
        }

        .phone-giant {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 10vw;
            color: #fff;
            text-decoration: none;
            display: block;
            letter-spacing: 0.02em;
        }

        .phone-sub {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-top: 1rem;
        }

        /* Bio Text */
        .bio-text {
            padding: 4rem 1.5rem;
            background: #000;
        }

        .bio-text p {
            font-size: 0.85rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.5);
            max-width: 280px;
        }

        /* Footer */
        footer {
            padding: 2rem 1.5rem;
            font-size: 0.65rem;
            opacity: 0.3;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }

        /* Popup */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-overlay.active {
            display: flex;
        }

        .popup-content {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 320px;
        }

        .popup-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0.5;
        }

        .popup-content h2 {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 25vw;
            margin-bottom: 1rem;
        }

        .popup-content p {
            font-size: 0.85rem;
            opacity: 0.6;
            margin-bottom: 2rem;
        }

        .popup-form {
            display: flex;
            margin-bottom: 2rem;
        }

        .popup-form input {
            flex: 1;
            padding: 1rem;
            font-size: 1rem;
            background: transparent;
            border: 1px solid #333;
            border-right: none;
            color: #fff;
        }

        .popup-form button {
            padding: 1rem 1.5rem;
            font-family: Impact, 'Arial Black', sans-serif;
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
        }

        .popup-phone {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 7vw;
            color: #fff;
            text-decoration: none;
        }

        /* Sticky contact bar */
        .sticky-contact {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            border-top: 1px solid #222;
            padding: 0.75rem 1rem;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .sticky-contact.visible {
            display: flex;
        }

        .sticky-contact a {
            font-family: Impact, 'Arial Black', sans-serif;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .sticky-contact .cta {
            background: #fff;
            color: #000;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body class="locked">

    <!-- Hero Video -->
    <section class="hero-video">
        <video autoplay muted loop playsinline>
            <source src="videos/hero.MOV" type="video/quicktime">
            <source src="videos/hero.mp4" type="video/mp4">
        </video>
        <div class="scroll-prompt" id="scrollPrompt">Scroll</div>
    </section>

    <!-- Image Stream -->
    <div class="image-stream" id="imageStream"></div>

    <!-- Sticky Contact Bar -->
    <div class="sticky-contact" id="stickyContact">
        <a href="tel:3102951136">310-295-1136</a>
        <a href="mailto:josh@jwgre.com" class="cta">GET IN TOUCH</a>
    </div>

    <!-- Contact Popup -->
    <div class="popup-overlay" id="popup">
        <div class="popup-content">
            <button class="popup-close" onclick="closePopup()">×</button>
            <h2>In?</h2>
            <p>Get early access to our next project</p>
            <form class="popup-form" action="mailto:josh@jwgre.com" method="GET">
                <input type="email" name="email" placeholder="Email" required>
                <button type="submit">→</button>
            </form>
            <a href="tel:3102951136" class="popup-phone">310-295-1136</a>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <span>© 2026 Gibson</span>
        <a href="mailto:josh@jwgre.com">josh@jwgre.com</a>
    </footer>

    <script>
        // Force lock scroll for 3 seconds - no escape
        function preventScroll(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        
        // Block ALL scroll attempts
        document.addEventListener('wheel', preventScroll, { passive: false });
        document.addEventListener('touchmove', preventScroll, { passive: false });
        document.addEventListener('keydown', function(e) {
            if ([32, 33, 34, 35, 36, 37, 38, 39, 40].includes(e.keyCode)) {
                e.preventDefault();
            }
        });

        // Unlock after 3 seconds
        setTimeout(() => {
            document.body.classList.remove('locked');
            document.getElementById('scrollPrompt').classList.add('visible');
            // Remove scroll blockers
            document.removeEventListener('wheel', preventScroll);
            document.removeEventListener('touchmove', preventScroll);
        }, 3000);

        // Show popup after 20 seconds OR 50% scroll
        let popupShown = false;
        const popup = document.getElementById('popup');
        const stickyContact = document.getElementById('stickyContact');

        function showPopup() {
            if (!popupShown) {
                popup.classList.add('active');
                popupShown = true;
            }
        }

        function closePopup() {
            popup.classList.remove('active');
        }

        // Show popup after 20 seconds
        setTimeout(showPopup, 20000);

        // Show sticky bar after scrolling past hero
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            const viewportHeight = window.innerHeight;
            
            // Show sticky bar after scrolling past video
            if (scrolled > viewportHeight) {
                stickyContact.classList.add('visible');
            } else {
                stickyContact.classList.remove('visible');
            }

            // Show popup at 40% scroll
            const docHeight = document.body.scrollHeight - viewportHeight;
            if (scrolled / docHeight > 0.4) {
                showPopup();
            }
        });

        // Close popup on overlay click
        popup.addEventListener('click', (e) => {
            if (e.target === popup) closePopup();
        });

        // All images
        const allImages = [
            "000191380001.jpg", "000191380002.jpg", "000191380003.jpg", "000191380004.jpg",
            "000191380005.jpg", "000191380006.jpg", "000191380007.jpg", "000191380008.jpg",
            "000191380009.jpg", "000191380010.jpg", "000191380011.jpg", "000191380012.jpg",
            "000191380013.jpg", "000191380014.jpg", "000191380015.jpg", "000191380016.jpg",
            "000191380017.jpg", "000191380018.jpg", "000191380019.jpg", "000191380020.jpg",
            "000191380021.jpg", "000191380023.jpg", "000191380024.jpg", "000191380025.jpg",
            "000191380026.jpg", "000191380027.jpg", "000191380028.jpg", "000191380029.jpg",
            "000191380030.jpg", "000191380031.jpg", "000191380032.jpg", "000191380033.jpg",
            "000191380034.jpg", "000191380035.jpg", "000191390001.jpg", "000191390002.jpg",
            "000191390003.jpg", "000191390004.jpg", "000191390006.jpg", "000191390007.jpg",
            "000191390008.jpg", "000191390009.jpg", "000191390010.jpg", "000191390011.jpg",
            "000191390012.jpg", "000191390013.jpg", "000191390014.jpg", "000191390015.jpg",
            "000191390016.jpg", "000191390017.jpg", "000191390018.jpg", "000191390019.jpg",
            "000191390020.jpg", "000191390021.jpg", "000191390022.jpg", "000191390023.jpg",
            "000191390024.jpg", "000191390025.jpg", "000191390026.jpg", "000191390027.jpg",
            "000191390028.jpg", "000191390029.jpg", "000191390030.jpg", "000191390031.jpg",
            "000191390032.jpg", "000191390034.jpg", "000191390035.jpg", "000191390036.jpg",
            "000191400001.jpg", "000191400002.jpg", "000191400003.jpg", "000191400004.jpg",
            "000191400005.jpg", "000191400006.jpg", "000191400007.jpg", "000191400008.jpg",
            "000191400009.jpg", "000191400010.jpg", "000191400011.jpg", "000191400012.jpg",
            "1.jpg", "2.jpg", "3.jpg", "4.jpg", "5.jpg", "6.jpg", "7.jpg", "8.jpg",
            "9.jpg", "10.jpg", "11.jpg", "12.jpg", "13.jpg", "14.jpg", "15.jpg",
            "16.jpg", "17.jpg", "18.jpg", "19.jpg", "20.jpg", "21.jpg", "22.jpg",
            "23.jpg", "24.jpg", "25.jpg", "26.jpg", "27.jpg", "28.jpg", "29.jpg", "30.jpg"
        ];

        // Shuffle array randomly
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const shuffledImages = shuffle([...allImages]);

        // Stats to overlay on certain positions
        const statPositions = {
            5: { number: 'RECORD', label: 'Breaking $ROI' },
            25: { number: '32', label: 'Bathrooms in 2024' },
            50: { number: '$14M', label: 'Renovations Completed' }
        };

        // Contact break positions (every 15 images)
        const contactBreakPositions = [15, 35, 55, 75, 95];

        const stream = document.getElementById('imageStream');

        shuffledImages.forEach((filename, index) => {
            // Insert contact break at intervals
            if (contactBreakPositions.includes(index)) {
                const contactDiv = document.createElement('div');
                contactDiv.className = 'contact-break';
                contactDiv.innerHTML = `
                    <h2>In?</h2>
                    <a href="tel:3102951136" class="phone-giant">310-295-1136</a>
                    <p class="phone-sub">Call anytime</p>
                `;
                stream.appendChild(contactDiv);
            }

            // Insert bio once
            if (index === 45) {
                const bioDiv = document.createElement('div');
                bioDiv.className = 'bio-text';
                bioDiv.innerHTML = `
                    <p>Josh + Naomi Gibson. Flipping houses since 2017. Mediterranean-inspired design for people who care about resale and how it feels to live there. LA.</p>
                `;
                stream.appendChild(bioDiv);
            }

            // Add image
            const div = document.createElement('div');
            div.className = 'image-item';
            
            let html = `<img src="images/${filename}" alt="" loading="lazy">`;
            
            if (statPositions[index]) {
                html += `
                    <div class="stat-overlay">
                        <div class="stat-number">${statPositions[index].number}</div>
                        <div class="stat-label">${statPositions[index].label}</div>
                    </div>
                `;
            }
            
            div.innerHTML = html;
            stream.appendChild(div);
        });
    </script>

</body>
</html>
